[config]
schemaVersion = "0.0.1"

[package]
namespace = "GordonFreesay"
name = "ValheimAutoModSync"
versionNumber = "2.6.0"
description = "Server-driven BepInEx mod sync for Valheim with signed manifests, SHA-256 verification, delta transfers, restart/reconnect, and no extra sync port."
websiteUrl = "https://github.com/GordonFreesay/ValheimAutoModSync"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]
categories = []
