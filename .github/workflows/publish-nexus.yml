name: Publish Nexus

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to Nexus Mods after the package builds'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  nexus:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read shared version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "AMS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Valheim Dedicated Server build references
        shell: pwsh
        run: ./.github/scripts/prepare-valheim-build.ps1

      - name: Build Nexus package
        shell: pwsh
        env:
          AMS_NO_PAUSE: "1"
          AMS_REQUIRE_SIGNING: "0"
        run: ./build-nexus.ps1

      - name: Write store package checksum
        shell: pwsh
        run: |
          $file = Join-Path $PWD 'Dist/ValheimAutoModSync-${{ env.AMS_VERSION }}-Nexus.zip'
          ./write-release-checksums.ps1 -Root $PWD -OutputPath 'Dist/SHA256SUMS-Nexus.txt' -Files @($file)

      - name: Attest exact store package
        uses: actions/attest@v4
        with:
          subject-path: Dist/ValheimAutoModSync-${{ env.AMS_VERSION }}-Nexus.zip

      - name: Attest store checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: Dist/SHA256SUMS-Nexus.txt

      - name: Upload store checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: ValheimAutoModSync-${{ env.AMS_VERSION }}-Nexus-SHA256
          path: Dist/SHA256SUMS-Nexus.txt
          archive: false
          if-no-files-found: error

      - name: Upload Nexus package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ValheimAutoModSync-${{ env.AMS_VERSION }}-Nexus
          path: Dist/ValheimAutoModSync-${{ env.AMS_VERSION }}-Nexus.zip
          archive: false
          if-no-files-found: error

      - name: Enforce Nexus network-tool clearance
        if: ${{ inputs.publish && vars.NEXUS_NETWORK_TOOL_CLEARANCE != 'approved' }}
        shell: pwsh
        run: throw 'Nexus publication is blocked until Nexus staff clearance is recorded as repository variable NEXUS_NETWORK_TOOL_CLEARANCE=approved.'

      - name: Validate Nexus publishing configuration
        if: ${{ inputs.publish && vars.NEXUS_NETWORK_TOOL_CLEARANCE == 'approved' }}
        shell: pwsh
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUSMODS_API_KEY)) { throw 'NEXUSMODS_API_KEY secret is not configured.' }

      - name: Resolve Nexus mod and file IDs
        id: nexus
        if: ${{ inputs.publish && vars.NEXUS_NETWORK_TOOL_CLEARANCE == 'approved' }}
        shell: pwsh
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_ID_OVERRIDE: ${{ vars.NEXUSMODS_FILE_ID }}
          NEXUSMODS_GAME_DOMAIN: valheim
          NEXUSMODS_GAME_SCOPED_MOD_ID: "4006"
        run: |
          $headers = @{
            apikey = $env:NEXUSMODS_API_KEY
            'User-Agent' = 'ValheimAutoModSync-GitHubActions'
          }

          $mod = Invoke-RestMethod -Method Get -Uri "https://api.nexusmods.com/v3/games/$env:NEXUSMODS_GAME_DOMAIN/mods/$env:NEXUSMODS_GAME_SCOPED_MOD_ID" -Headers $headers
          $modId = [string]$mod.data.id
          if ([string]::IsNullOrWhiteSpace($modId)) { throw 'Nexus mod lookup returned no internal mod ID.' }

          $fileResponse = Invoke-RestMethod -Method Get -Uri "https://api.nexusmods.com/v3/mods/$modId/files" -Headers $headers
          $files = @($fileResponse.data.mod_files)

          if (-not [string]::IsNullOrWhiteSpace($env:NEXUSMODS_FILE_ID_OVERRIDE)) {
            $match = @($files | Where-Object { [string]$_.id -eq $env:NEXUSMODS_FILE_ID_OVERRIDE })
            if ($match.Count -ne 1) { throw 'NEXUSMODS_FILE_ID override does not match a file belonging to this Nexus mod.' }
            $fileId = $env:NEXUSMODS_FILE_ID_OVERRIDE
          }
          else {
            $active = @($files | Where-Object { $_.is_active -eq $true })
            if ($active.Count -eq 1) {
              $fileId = [string]$active[0].id
            }
            elseif ($active.Count -eq 0) {
              throw 'No active Nexus file exists for AutoModSync. The official Nexus upload action creates versions of an existing file, so an initial file must exist first.'
            }
            else {
              throw "AutoModSync has $($active.Count) active Nexus files. Set repository variable NEXUSMODS_FILE_ID to select the file slot to update."
            }
          }

          "mod_id=$modId" >> $env:GITHUB_OUTPUT
          "file_id=$fileId" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved Nexus internal mod ID $modId and file ID $fileId from /valheim/mods/4006."

      - name: Read current changelog
        id: changelog
        if: ${{ inputs.publish && vars.NEXUS_NETWORK_TOOL_CLEARANCE == 'approved' }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $text = Get-Content -LiteralPath Thunderstore/CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^##\s+$([regex]::Escape($version))\s*\r?\n(.*?)(?=^##\s+|\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Valheim AutoModSync $version" }
          "text<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload to Nexus Mods
        if: ${{ inputs.publish && vars.NEXUS_NETWORK_TOOL_CLEARANCE == 'approved' }}
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          mod_id: ${{ steps.nexus.outputs.mod_id }}
          filename: Dist/ValheimAutoModSync-${{ steps.meta.outputs.version }}-Nexus.zip
          display_name: Valheim AutoModSync ${{ steps.meta.outputs.version }}
          description: Lightweight Nexus package. Requires BepInEx. AutoModSync synchronizes signed and SHA-256-verified mod files over the Valheim server connection selected by the user.
          version: ${{ steps.meta.outputs.version }}
          category: main
          changelog: ${{ steps.changelog.outputs.text }}
          update_mod_version: true
