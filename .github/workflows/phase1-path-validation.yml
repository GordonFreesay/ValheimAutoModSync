name: Phase 1 Path Validation

on:
  push:
    branches:
      - dev/2.6
    paths:
      - "Source/AutoModSync.PathSafety.cs"
      - "tests/test-phase1-paths.ps1"
      - ".github/workflows/phase1-path-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-boundary:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run isolated Phase 1 path-boundary harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests/test-phase1-paths.ps1"
