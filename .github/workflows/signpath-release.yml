name: SignPath Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build release on GitHub-hosted Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Valheim Dedicated Server build references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $steamCmdDir = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $steamCmdZip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          $valheimDir = Join-Path $env:RUNNER_TEMP 'valheim-dedicated-server'
          New-Item -ItemType Directory -Force -Path $steamCmdDir, $valheimDir | Out-Null
          Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $steamCmdZip
          Expand-Archive -LiteralPath $steamCmdZip -DestinationPath $steamCmdDir -Force
          $steamCmd = Join-Path $steamCmdDir 'steamcmd.exe'
          & $steamCmd +quit
          if ($LASTEXITCODE -ne 0) { throw "SteamCMD bootstrap failed with exit code $LASTEXITCODE" }
          & $steamCmd +force_install_dir $valheimDir +login anonymous +app_update 896660 validate +quit
          if ($LASTEXITCODE -ne 0) { throw "SteamCMD Valheim install failed with exit code $LASTEXITCODE" }
          $gameAssembly = Get-ChildItem -LiteralPath $valheimDir -Filter 'assembly_valheim.dll' -Recurse -File | Select-Object -First 1
          if (-not $gameAssembly) { throw 'Valheim Dedicated Server did not provide assembly_valheim.dll.' }
          if (-not (Test-Path (Join-Path $valheimDir 'valheim_server.exe'))) { throw 'valheim_server.exe was not installed.' }
          "AMS_VALHEIMROOT=$valheimDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using managed references from $($gameAssembly.DirectoryName)"

      - name: Build unsigned release from source
        shell: cmd
        env:
          AMS_NO_PAUSE: "1"
          AMS_REQUIRE_SIGNING: "0"
        run: build-release.bat

      - name: Locate release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-ChildItem -LiteralPath 'Dist' -Filter 'ValheimAutoModSync-*.zip' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $release) { throw 'Release ZIP was not produced.' }
          "RELEASE_ZIP=$($release.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Unsigned release artifact: $($release.FullName)"

      - name: Upload unsigned artifact for origin verification
        id: upload_unsigned
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASE_ZIP }}
          archive: false
          if-no-files-found: error

      - name: Submit signing request to SignPath
        if: ${{ github.event_name == 'workflow_dispatch' && env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signpath-signed

      - name: Upload SignPath-signed artifact
        if: ${{ github.event_name == 'workflow_dispatch' && env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' && env.SIGNPATH_PROJECT_SLUG != '' && env.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: signpath-signed-release
          path: ${{ runner.temp }}\signpath-signed\*
          if-no-files-found: error

      - name: SignPath setup note
        if: ${{ github.event_name == 'workflow_dispatch' && (env.SIGNPATH_API_TOKEN == '' || env.SIGNPATH_ORGANIZATION_ID == '' || env.SIGNPATH_PROJECT_SLUG == '' || env.SIGNPATH_SIGNING_POLICY_SLUG == '') }}
        shell: pwsh
        run: Write-Host 'Build and GitHub artifact upload succeeded. Add the SignPath secret/variables after Foundation approval to enable signing requests.'
