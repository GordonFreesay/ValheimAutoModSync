name: Phase 7 UI State Validation

on:
  push:
    branches:
      - dev/2.6
    paths:
      - "Source/AutoModSync.SyncUiState.cs"
      - "test-phase7-ui-state.ps1"
      - ".github/workflows/phase7-ui-state-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-state:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic Phase 7 UI-state harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\test-phase7-ui-state.ps1"
