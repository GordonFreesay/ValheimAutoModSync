name: 2.6.1 Security Hardening Validation

on:
  push:
    branches:
      - release/2.6.1-password-boundary
    paths:
      - "VERSION"
      - "Source/**"
      - "RELEASE-NOTES-2.6.1.md"
      - "build-release.bat"
      - "build-dev.bat"
      - "build-modsite-package.ps1"
      - "build-thunderstore.ps1"
      - "deploy-dev.ps1"
      - "install.bat"
      - "SIGNING.md"
      - "ModSites/README.md"
      - "README.md"
      - "DISTRIBUTION.md"
      - "tests/test-2.6.1-password-boundary.ps1"
      - "tests/test-2.6.1-installer-updater.ps1"
      - "tests/test-installer-contract.ps1"
      - "tests/test-phase2-adversarial.ps1"
      - "tests/test-phase6-ownership.ps1"
      - "verify-version.ps1"
      - "verify-source-docs.ps1"
      - "verify-no-pii.ps1"
      - ".github/workflows/2.6.1-password-boundary-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "VERSION"
      - "Source/**"
      - "RELEASE-NOTES-2.6.1.md"
      - "build-release.bat"
      - "build-dev.bat"
      - "build-modsite-package.ps1"
      - "build-thunderstore.ps1"
      - "deploy-dev.ps1"
      - "install.bat"
      - "SIGNING.md"
      - "ModSites/README.md"
      - "README.md"
      - "DISTRIBUTION.md"
      - "tests/test-2.6.1-password-boundary.ps1"
      - "tests/test-2.6.1-installer-updater.ps1"
      - "tests/test-installer-contract.ps1"
      - "tests/test-phase2-adversarial.ps1"
      - "tests/test-phase6-ownership.ps1"
      - "verify-version.ps1"
      - "verify-source-docs.ps1"
      - "verify-no-pii.ps1"
      - ".github/workflows/2.6.1-password-boundary-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-hardening:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify version consistency
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\verify-version.ps1"

      - name: Verify source documentation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\verify-source-docs.ps1"

      - name: Scan first-party source for PII
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\verify-no-pii.ps1" -Root "."

      - name: Validate 2.6.1 security and preflight boundaries
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests\test-2.6.1-password-boundary.ps1"

      - name: Validate single installer updater contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests\test-2.6.1-installer-updater.ps1"

      - name: Compile and validate installer contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests\test-installer-contract.ps1"

      - name: Validate transactional rollback and recovery engine
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests\test-phase2-adversarial.ps1"

      - name: Validate ownership and transactional apply engine
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests\test-phase6-ownership.ps1"
