name: Apply Transaction Regression

on:
  push:
    branches:
      - dev/2.6
    paths:
      - "Source/ValheimAutoModSync.Apply.cs"
      - "Source/AutoModSync.OwnershipState.cs"
      - "Source/AutoModSync.PathSafety.cs"
      - "tests/test-phase2-adversarial.ps1"
      - ".github/workflows/apply-transaction-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-regression:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile development Apply helper
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          & $csc /nologo /target:winexe /optimize+ /langversion:5 /define:AMS_DEV_TESTS /out:".\ValheimAutoModSync.Apply.exe" ".\Source\ValheimAutoModSync.Apply.cs" ".\Source\AutoModSync.PathSafety.cs" ".\Source\AutoModSync.OwnershipState.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Phase 2 adversarial regression harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests/test-phase2-adversarial.ps1" -Helper ".\ValheimAutoModSync.Apply.exe"
