name: Installer Transaction Regression

on:
  push:
    branches:
      - dev/2.6
      - release/2.6.1-password-boundary
    paths:
      - "Source/AutoModSync.ApplyEngine.cs"
      - "Source/ValheimAutoModSync.Installer.cs"
      - "Source/AutoModSync.OwnershipState.cs"
      - "Source/AutoModSync.PathSafety.cs"
      - "tests/test-phase2-adversarial.ps1"
      - ".github/workflows/apply-transaction-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-transaction-regression:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Phase 2 adversarial regression harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests/test-phase2-adversarial.ps1"
