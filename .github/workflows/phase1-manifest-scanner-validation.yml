name: Phase 1 Manifest Scanner Validation

on:
  push:
    branches:
      - dev/2.6
    paths:
      - "Source/AutoModSync.PathSafety.cs"
      - "Source/AutoModSync.ManifestScanner.cs"
      - "Source/ValheimAutoModSync.Server.cs"
      - "tests/test-phase1-manifest-scanner.ps1"
      - ".github/workflows/phase1-manifest-scanner-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-scanner:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run isolated production manifest-scanner harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests/test-phase1-manifest-scanner.ps1"
