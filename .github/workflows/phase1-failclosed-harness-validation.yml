name: Phase 1 Fail-Closed Harness Validation

on:
  push:
    branches:
      - dev/2.6
    paths:
      - "Source/ValheimAutoModSync.Client.cs"
      - "Source/ValheimAutoModSync.Server.cs"
      - "test-phase1-failclosed-live.ps1"
      - "TESTING-2.6.md"
      - ".github/workflows/phase1-failclosed-harness-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-harness:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source documentation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\verify-source-docs.ps1"

      - name: Validate version consistency
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\verify-version.ps1"

      - name: Parse guided fail-closed PowerShell suite
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\test-phase1-failclosed-live.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax check passed."
