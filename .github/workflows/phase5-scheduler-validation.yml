name: Phase 5 Scheduler Validation

on:
  push:
    branches:
      - dev/2.6
    paths:
      - "Source/AutoModSync.TransferScheduler.cs"
      - "test-phase5-scheduler.ps1"
      - ".github/workflows/phase5-scheduler-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic Phase 5 scheduler harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\test-phase5-scheduler.ps1"
