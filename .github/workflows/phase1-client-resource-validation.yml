name: Phase 1 Client Resource Validation

on:
  push:
    branches:
      - dev/2.6
    paths:
      - "Source/ValheimAutoModSync.Client.cs"
      - "Source/AutoModSync.ClientResourceSafety.cs"
      - "tests/test-phase1-client-resources.ps1"
      - ".github/workflows/phase1-client-resource-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-resources:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run isolated client resource-limit harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ".\tests/test-phase1-client-resources.ps1"
