[General]

## Enable the AutoModSync server role on this Valheim instance.
Enabled = true

## Semicolon-separated wildcard patterns that are NOT copied to clients.
## Add any server-only plugins here.
ExcludePatterns = ValheimAutoModSync.Server.dll;ValheimAutoModSync.Client.dll;ValheimAutoModSync.Apply.exe;manifest.json;icon.png;README.md;CHANGELOG.md;LICENSE;THIRD-PARTY-NOTICES.md;*.pdb;*.mdb;*.log;*.tmp;*.bak;*.md

## Seconds to cache synchronized-root hashes before rescanning.
ManifestCacheSeconds = 5

[Compatibility]

## Plugin/patcher paths that exist on the server but must never be copied to clients.
## Match is checked against both the relative path and filename.
ServerOnlyPatterns =

## Optional plugin/patcher allowlist. Empty means every non-excluded, non-server-only
## plugin/patcher file is required by clients. If set, use folder wildcards when a mod
## has dependency DLLs/assets beside its main DLL, for example SomeMod/*.
ClientRequiredPatterns =

## Synchronize BepInEx\patchers recursively. Individual server-only patchers can be
## excluded with ServerOnlyPatterns.
SyncPatchers = true

## BepInEx\config is NOT mirrored by default. Add only configs that truly must be
## identical on clients. Examples: com.example.required.cfg;RequiredMod/*.json
## ValheimAutoModSync.private.xml, ValheimAutoModSync.public.xml, and BepInEx.cfg are
## always blocked even if a broad pattern matches.
SyncConfigPatterns =

[Transfer]

## Raw bytes per Valheim RPC chunk before Base64 encoding.
ChunkBytes = 24576

## Refuse to send a single plugin file larger than this many MiB.
MaxFileMiB = 128

## Refuse to build a compressed change package larger than this many MiB.
MaxBundleMiB = 2048

## Refuse a requested change set whose signed source files exceed this many MiB
## before compression. This protects CPU/disk work independently of ZIP ratio.
MaxExpandedBundleMiB = 4096

## Keep a completed immutable bundle reusable for this many seconds after its last
## real client use. Identical fresh clients can share the same ZIP instead of recompressing
## the same server mod set. 0 retains ordinary artifacts only while actively referenced.
## A startup-prewarmed fresh-client artifact is kept until its first real client use
## (subject to the disk budget below), then this normal TTL applies.
BundleCacheSeconds = 600

## Maximum total size of retained completed bundle artifacts. Idle least-recently-used
## artifacts are evicted first; an artifact still being transferred is never deleted.
BundleCacheMaxMiB = 4096

## On a dedicated server, build the likely nearly-bare-client package during startup
## instead of making the first player wait for ZIP creation. The baseline is every signed
## distributable file except ValheimAutoModSync.Client.dll, which a client must already
## have in order to initiate AutoModSync. Partial/delta clients still use the lazy cache.
PrebuildFreshClientBundle = true

## Temporary SteamNetworkingSockets settings used only while AutoModSync is
## transferring a bundle, then restored to the exact previous per-connection values.
## Valheim normally starts both send-rate bounds near 153600 B/s.
SendRateMaxBytesPerSec = 67108864

## Temporary send-rate floor during the bundle. A 313.4 MiB 2.6 development run showed
## Steam pinned to the prior 8 MiB/s floor for the full transfer, so the next validation
## baseline uses 16 MiB/s while keeping the setting temporary and per-connection.
## Set 0 to leave unchanged.
SendRateMinBytesPerSec = 16777216

## Temporary reliable send-buffer target for bundle bursts. Set 0 to leave unchanged.
SendBufferBytes = 33554432

## Maximum number of clients that may actively transfer AutoModSync bundle data at once.
## Runtime clamps this to 1..32. Additional clients remain connected in a FIFO queue.
MaxActiveBundleTransfers = 4

## Maximum additional validated bundle requests retained while active slots are busy.
## Requests beyond this bounded queue are rejected for that join instead of consuming
## unbounded server memory. Runtime clamps this to 0..1024.
MaxQueuedBundleTransfers = 32

## Server-wide raw bundle-payload ceiling shared by every active AutoModSync transfer.
## This is independent of each connection's SendRateMaxBytesPerSec. The default is 64 MiB/s.
AggregateSendRateMaxBytesPerSec = 67108864

## Maximum raw bytes one client may receive in one scheduler turn before round-robin
## advances to another active client. Individual RPC/Steam messages remain <=384 KiB.
SchedulerGrantBytes = 1048576

## Stop adding new AutoModSync data when Steam's pending + unacked reliable bytes
## represent roughly this many milliseconds at its current reported send rate.
## This avoids treating the large reliable send buffer as a target. 0 disables the check.
SchedulerMaxSteamQueueMs = 200

## Release an active transfer slot if a connected client has no outstanding request and
## does not request more bundle data for this many seconds. Queued clients are not expired.
TransferIdleTimeoutSeconds = 60
