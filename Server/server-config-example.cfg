[General]

## Enable the AutoModSync server role on this Valheim instance.
Enabled = true

## Semicolon-separated wildcard patterns that are NOT copied to clients.
## Add any server-only plugins here.
ExcludePatterns = ValheimAutoModSync.Server.dll;ValheimAutoModSync.Client.dll;*.pdb;*.mdb;*.log;*.tmp;*.bak;*.md

## Seconds to cache synchronized-root hashes before rescanning.
ManifestCacheSeconds = 5

[Compatibility]

## Plugin/patcher paths that exist on the server but must never be copied to clients.
## Match is checked against both the relative path and filename.
ServerOnlyPatterns =

## Optional plugin/patcher allowlist. Empty means every non-excluded, non-server-only
## plugin/patcher file is required by clients. If set, use folder wildcards when a mod
## has dependency DLLs/assets beside its main DLL, for example SomeMod/*.
ClientRequiredPatterns =

## Synchronize BepInEx\patchers recursively. Individual server-only patchers can be
## excluded with ServerOnlyPatterns.
SyncPatchers = true

## BepInEx\config is NOT mirrored by default. Add only configs that truly must be
## identical on clients. Examples: com.example.required.cfg;RequiredMod/*.json
## ValheimAutoModSync.private.xml, ValheimAutoModSync.public.xml, and BepInEx.cfg are
## always blocked even if a broad pattern matches.
SyncConfigPatterns =

[Transfer]

## Raw bytes per Valheim RPC chunk before Base64 encoding.
ChunkBytes = 24576

## Refuse to send a single plugin file larger than this many MiB.
MaxFileMiB = 128

## Refuse to build a compressed change package larger than this many MiB.
MaxBundleMiB = 2048

## Temporary SteamNetworkingSockets per-connection send-rate ceiling used only while
## AutoModSync is transferring a bundle. Valheim normally pins the ceiling near
## 153600 B/s. Only the maximum is raised; the minimum is left untouched so Steam
## can still back off for weak/congested links.
SendRateMaxBytesPerSec = 8388608
